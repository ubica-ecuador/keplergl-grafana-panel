# Builds the documentation site and publishes it to GitHub Pages.
#
# The site is its own npm package under docs/site, with its own lockfile, so
# nothing here touches the plugin's dependency tree — CI's `npm ci` for the
# plugin stays exactly as fast as it was.
#
# Requires Pages to be enabled on the repository, with Settings -> Pages ->
# Source set to "GitHub Actions". Without that, the deploy job fails with a
# permissions error rather than anything more helpful.
name: Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one that is already running: a
# half-deployed Pages site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install
        run: npm ci
        working-directory: docs/site

      - name: Build
        run: npm run build
        working-directory: docs/site
        env:
          # The site has its own domain, docs.ubica.dev, configured in
          # Settings -> Pages, so it is served from the root and asset URLs
          # carry no prefix. Without one, a project Pages site lives under
          # /<repo>/ and this would have to be /${{ github.event.repository.name }}/.
          DOCS_BASE: /

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
