# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
      # The two below exist for `attestation: true` further down, which has the
      # build sign a provenance record with this workflow's own OIDC identity:
      # `id-token` to mint that identity, `attestations` to store the record
      # against the repository. The build step fails outright without them
      # rather than quietly skipping the attestation.
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Wired for both sides of the catalog review, so this file does not have
      # to be edited on the day the answer arrives.
      #
      # A plugin that has never been published *cannot* be signed: the signature
      # level is something the review grants, not something a token buys. Grafana
      # says so in both directions — "you don't need to sign a plugin ... when you
      # submit a plugin for review for the first time", and "the Grafana team
      # needs to review public plugins before you can sign them ... you're granted
      # a plugin signature level. You need this signature level to proceed". The
      # plugin validator agrees: for a new plugin it reports "unsigned plugin" as
      # a warning whose own detail reads "This is expected during the initial
      # review process."
      #
      # So an unsigned archive is not a defect right now, it is the required
      # state, and the release this workflow builds is exactly what the
      # submission form asks for: it publishes the zip (the form's **URL**) and
      # its sha1 (the form's **SHA1**) onto a GitHub Release.
      #
      # `policy_token` is passed unconditionally anyway because the action's own
      # sign step is guarded by `if: inputs.policy_token != ''`, and GitHub
      # substitutes an empty string for a secret that does not exist. Before
      # approval the secret is unset, the sign step is skipped with a warning,
      # and the archive comes out unsigned — which is what has to be submitted.
      # After approval, adding GRAFANA_ACCESS_POLICY_TOKEN to the repository
      # secrets turns signing on with no change here: the next tag is signed.
      #
      # To generate the token once the level is granted:
      # https://grafana.com/developers/plugin-tools/publish-a-plugin/sign-a-plugin#generate-an-access-policy-token
      - uses: grafana/plugin-actions/build-plugin@build-plugin/v1.2.0
        with:
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          # A verifiable record of where this archive came from, which the
          # catalog checks on submission: without it the report reads "No
          # provenance attestation. This plugin was built without build
          # verification." Unlike the signature it does not wait for the
          # review — it works from the very first tag. Needs the two extra
          # permissions above.
          attestation: true
          # `use_changelog_generator` is deliberately NOT set. It runs
          # github-changelog-generator and commits the result over CHANGELOG.md,
          # which here would destroy a changelog written by hand. Leave it off.
