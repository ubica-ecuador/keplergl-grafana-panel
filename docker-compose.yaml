services:
  # Grafana 12.0.10 — the floor of the range declared in src/plugin.json.
  #
  # Not 12.0.0: Grafana only added `react/jsx-runtime` to its SystemJS import map
  # in 12.0.10 / 12.1.7 / 12.2.5, and the scaffold externalizes it. On 12.0.0 the
  # plugin fails to load outright with "404 Not Found, loading react/jsx-runtime".
  # Developing against the floor catches accidental use of newer APIs.
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    build:
      args:
        grafana_version: ${GRAFANA_VERSION:-12.0.10}
    # The MobilityDB container lives in another Compose project, so its name is
    # not resolvable from this network. It does publish 5432 on the host, and
    # `host-gateway` maps to the host from inside the container — that is what
    # provisioning/datasources/datasources.yml dials.
    # Grafana keeps its SQLite database — dashboards, users, preferences — under
    # /var/lib/grafana. Without this it lives in the container's writable layer,
    # so a plain `docker compose down` takes every dashboard that was not
    # provisioned from ./provisioning with it. Compose appends to sequences when
    # merging, so this is added to the base file's mounts rather than replacing
    # them; the nested plugin bind still wins on its own deeper path.
    volumes:
      - grafana-data:/var/lib/grafana
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      # Read from .env (gitignored) so the password stays out of version control.
      MOBILITYDB_PASSWORD: ${MOBILITYDB_PASSWORD:-}

  # Same Grafana, strict Content-Security-Policy, on port 3001.
  #
  # maplibre-gl@4 spawns its Web Workers from blob: URLs. A hardened Grafana
  # sets `worker-src` and can block them, which would break the map for any
  # locked-down install. Exit criterion 3 of the Phase 0 spike is verified here,
  # not discovered in production.
  #
  # Deliberately NOT using `extends`: Compose appends to sequences when merging,
  # so an inherited `ports: [3000:3000]` cannot be overridden — both containers
  # would fight for host port 3000.
  grafana-csp:
    user: root
    container_name: 'ubica-keplergl-panel-csp'
    build:
      context: .config
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-12.0.10}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - '3001:3000/tcp'
    volumes:
      - ./dist:/var/lib/grafana/plugins/ubica-keplergl-panel
      - ./provisioning:/etc/grafana/provisioning
      # Its own database, deliberately not shared with the `grafana` service:
      # two Grafanas provisioning into one SQLite file race each other and the
      # loser dies at startup with "Datasource provisioning error: database is
      # locked".
      - grafana-csp-data:/var/lib/grafana
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      MOBILITYDB_PASSWORD: ${MOBILITYDB_PASSWORD:-}
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.ubica-keplergl-panel:debug
      GF_LOG_LEVEL: debug
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: ubica-keplergl-panel
      GF_SECURITY_CONTENT_SECURITY_POLICY: 'true'
      # Grafana's stock CSP template, plus the two deltas this plugin needs:
      # `connect-src` must allow the basemap hosts. maplibre fetches style.json,
      # sprites, glyph .pbf files and vector tiles over XHR, so they all fall
      # under connect-src rather than img-src/font-src. Carto serves the default
      # base maps; Esri serves the tiles of the satellite and topographic ones;
      # Mapterhorn serves the elevation tiles behind the two relief styles.
      #
      # Verified with the stock template: the plugin still loads, the map still
      # renders and Web Workers still start — only the basemap goes missing.
      GF_SECURITY_CONTENT_SECURITY_POLICY_TEMPLATE: >-
        script-src 'self' 'unsafe-eval' 'unsafe-inline' 'strict-dynamic' $$NONCE;object-src 'none';font-src
        'self';style-src 'self' 'unsafe-inline' blob:;img-src * data:;base-uri 'self';connect-src 'self'
        grafana.com https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com
        https://services.arcgisonline.com https://tiles.mapterhorn.com ws://$$ROOT_PATH
        wss://$$ROOT_PATH;manifest-src 'self';media-src 'none';form-action 'self';

  # Sources bench, on port 3002: the file-based formats the panel is meant to
  # read — GeoParquet, GeoJSON, CSV — through the two data sources that serve
  # them. Kept apart from the `grafana` service on purpose, for two reasons.
  #
  # First, the image. The DuckDB data source is a Go binary linked against
  # glibc, and the scaffold's default `grafana-enterprise` image is Alpine/musl:
  # it fails to load there with "libstdc++.so.6: cannot open shared object
  # file". Hence the `-ubuntu` tag. Moving the main dev Grafana to Ubuntu would
  # have been the smaller diff, but that instance is deliberately pinned to the
  # floor of the supported range on the stock image — it is the thing that
  # catches "works on my machine", so it stays as the plainest install we ship
  # to.
  #
  # Second, provisioning. This service mounts ./provisioning-sources rather than
  # ./provisioning, so the two Alpine instances never see data sources whose
  # plugin cannot load.
  grafana-sources:
    user: root
    container_name: 'ubica-keplergl-panel-sources'
    build:
      context: .config
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-12.0.10}-ubuntu
        # Must stay false. On true the entrypoint hands over to supervisord
        # instead of Grafana's own /run.sh, and /run.sh is what reads
        # GF_INSTALL_PLUGINS — the data sources below would silently never
        # install.
        development: 'false'
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - '3002:3000/tcp'
    volumes:
      - ./dist:/var/lib/grafana/plugins/ubica-keplergl-panel
      - ./provisioning-sources:/etc/grafana/provisioning
      # DuckDB reads the GeoParquet straight off this mount; the same directory
      # is what `sources-data` serves over HTTP for Infinity.
      - ./testdata:/testdata:ro
      # Its own database. Two Grafanas provisioning into one SQLite file race
      # each other and the loser dies with "database is locked".
      - grafana-sources-data:/var/lib/grafana
    environment:
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.ubica-keplergl-panel:debug
      GF_LOG_LEVEL: debug
      # The DuckDB data source ships no MANIFEST.txt — it is distributed from
      # GitHub releases rather than the Grafana catalogue, so it is unsigned and
      # has to be named here alongside our own panel.
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: ubica-keplergl-panel,motherduck-duckdb-datasource
      # Infinity comes from the catalogue by id. DuckDB is not in the catalogue
      # at all, so it is installed from its release zip with `<url>;<id>`. That
      # zip is ~140 MB — it bundles a DuckDB engine per platform — and lands in
      # the named volume above, so this download happens once, not per restart.
      # The first start needs outbound internet.
      GF_INSTALL_PLUGINS: 'yesoreyeram-infinity-datasource,https://github.com/motherduckdb/grafana-duckdb-datasource/releases/download/v0.4.5/motherduck-duckdb-datasource-0.4.5.zip;motherduck-duckdb-datasource'

  # Serves ./testdata over HTTP so Infinity exercises a real URL fetch rather
  # than inline data. Only reachable from the compose network — no published
  # port — and read-only.
  sources-data:
    image: nginx:alpine
    container_name: 'ubica-keplergl-panel-sources-data'
    volumes:
      - ./testdata:/usr/share/nginx/html:ro
      - ./docker/sources-data.nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  grafana-data:
  grafana-csp-data:
  grafana-sources-data:
