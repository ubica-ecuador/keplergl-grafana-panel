# Static file server for the rasters DuckDB computed, on the browser's side of
# the network.
#
# Its whole reason to exist is PMTiles: kepler reads that format itself, with
# range requests straight from the browser, so the archive needs somewhere to
# be fetched from — and `sources-data` is deliberately unpublished, reachable
# only from inside the compose network where Infinity lives.
server {
    listen 80;
    root /usr/share/nginx/html;
    autoindex on;

    # A PMTiles archive is read by asking for byte ranges of it — the header
    # first, then a directory, then single tiles. nginx serves ranges out of
    # the box; what it does not do is announce them across origins, and a
    # browser will not issue a ranged cross-origin request it cannot read the
    # answer to. Both headers are needed: the second is what makes
    # `Content-Range` and `Accept-Ranges` visible to the fetch that asked.
    add_header Access-Control-Allow-Origin '*' always;
    add_header Access-Control-Expose-Headers 'Accept-Ranges, Content-Range, Content-Length' always;
    # Without this, a cross-origin response reports zero bytes to the Resource
    # Timing API — which makes "did it fetch a tile or just the header?"
    # unanswerable from the browser. Diagnosis only; it exposes nothing the
    # reader could not already measure with a stopwatch.
    add_header Timing-Allow-Origin '*' always;

    # nginx ships no MIME type for .pmtiles. octet-stream is what it would fall
    # back to anyway; naming it means the response says what the file is rather
    # than what nginx failed to recognise.
    location ~ \.pmtiles$ {
        default_type application/octet-stream;
    }
}
