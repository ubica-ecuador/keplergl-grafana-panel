# The MBTA feeds behind gtfs-rt-mbta.json go through here rather than straight
# to Boston. Every panel of that dashboard fetches a feed on every 30 s refresh,
# for every visitor, and MBTA's developer licence asks for no more than one
# request every 10 s. A 15 s cache makes the upstream rate independent of how
# many people have the dashboard open.
proxy_cache_path /var/cache/nginx/mbta levels=1:2 keys_zone=mbta:10m
                 max_size=200m inactive=2h use_temp_path=off;

# NOAA GFS from PacIOOS ERDDAP, behind gfs-wind-synoptic.json. ERDDAP builds
# every answer on the spot, and how long that takes swings wildly: the same
# 48-hour request was measured at 1.9 s, 28 s and 376 s within minutes. A
# dashboard query that waits more than about 30 s is cut off, and DuckDB asks
# twice -- a HEAD, then the GET -- each built in full. The dashboards write
# their time window into the URL from the clock, so one URL stands for three
# hours; cached here, ERDDAP is asked once per window, whoever is looking.
proxy_cache_path /var/cache/nginx/erddap levels=1:2 keys_zone=erddap:10m
                 max_size=1g inactive=6h use_temp_path=off;

# TriMet (Portland), behind trimet-live.json. Every call needs an AppID in the
# query string, and this is where it is added, so the dashboard never carries
# it: not in git, and not in the query inspector of a public instance. It comes
# from TRIMET_APP_ID in .env; the nginx image runs envsubst over
# /etc/nginx/templates when the container starts, which is why this file is
# mounted there and not in conf.d.
proxy_cache_path /var/cache/nginx/trimet levels=1:2 keys_zone=trimet:10m
                 max_size=200m inactive=2h use_temp_path=off;
map $args $trimet_args {
    ''      'appID=${TRIMET_APP_ID}';
    default 'appID=${TRIMET_APP_ID}&$args';
}

server {
    listen 80;
    root /usr/share/nginx/html;
    autoindex on;

    # nginx ships no MIME type for .geojson, so it would go out as
    # application/octet-stream. The Infinity queries name their type explicitly
    # and would cope, but serving it as JSON keeps the fixture honest for
    # anything else that fetches it — a browser, or `curl | jq`.
    location ~ \.geojson$ {
        default_type application/json;
    }

    # Upstream hosts live in variables, resolved per request through Docker's
    # DNS. A literal hostname in proxy_pass is resolved once at startup, and a
    # startup without network would then take the whole container down —
    # including the fixtures every other dashboard reads.
    resolver 127.0.0.11 valid=300s ipv6=off;

    proxy_cache mbta;
    proxy_cache_key $uri;
    # Concurrent misses wait for one upstream fetch instead of each making one.
    proxy_cache_lock on;
    # Stale copies only when MBTA is failing. Deliberately no `updating` and no
    # background update: after an idle spell those hand out the expired copy
    # first and refresh behind it, so the first visitor saw a feed minutes old
    # on a dashboard whose job is to measure exactly that.
    proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_hide_header Set-Cookie;
    proxy_ssl_server_name on;
    # The cache key ignores Accept-Encoding, so upstream must always answer
    # uncompressed; otherwise one gzip-accepting client would poison the entry.
    proxy_set_header Accept-Encoding "";
    # DuckDB reads Parquet with range requests; serve them from the cached file.
    proxy_force_ranges on;

    # Real-time feeds: VehiclePositions, TripUpdates, Alerts, as .pb or .json.
    location ~ ^/mbta/realtime/([A-Za-z_]+\.(json|pb))$ {
        set $mbta_rt cdn.mbta.com;
        proxy_pass https://$mbta_rt/realtime/$1;
        proxy_set_header Host $mbta_rt;
        proxy_cache_valid 200 15s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ERDDAP griddap, query string and all: the hours and the box are in it.
    location ^~ /erddap/ {
        set $erddap pae-paha.pacioos.hawaii.edu;
        # $request_uri as it arrived, still percent-encoded: ERDDAP wants its
        # brackets as %5B/%5D, and a decoded copy would not be the same URL.
        proxy_pass https://$erddap$request_uri;
        proxy_set_header Host $erddap;
        proxy_cache erddap;
        proxy_cache_key $request_uri;
        # A forecast step's values change only when a new run lands, every six
        # hours, and the dashboards' URLs move on every three anyway.
        proxy_cache_valid 200 3h;
        # A slow answer is still worth keeping: if Grafana gives up on it, the
        # fetch carries on and the next visitor finds it here.
        proxy_ignore_client_abort on;
        proxy_read_timeout 600s;
        # Concurrent misses -- DuckDB's HEAD and GET, two panels, two visitors --
        # wait for the one fetch in flight, for as long as ERDDAP can take,
        # rather than the default 5 s after which each goes upstream itself.
        proxy_cache_lock_timeout 600s;
        proxy_cache_lock_age 600s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # TriMet's web services, v2 and V1. What makes this location different from
    # the others is the key it adds, so it only answers the compose network:
    # on an instance where this server is published, an open /trimet/ would
    # lend the AppID to anyone. A request relayed by the public proxy arrives
    # from a private address too, but carrying X-Forwarded-For.
    #
    # Always asked for gzip and passed through as it comes: the trip status
    # feed is 11 MB plain and 1 MB gzipped, and the queries read it with
    # `compression = 'gzip'`. Kept 15 s: one fetch per dashboard refresh,
    # however many panels and visitors ask.
    location ~ ^/trimet/(ws/(?:v2|V1)/[A-Za-z]+)$ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        if ($http_x_forwarded_for) {
            return 403;
        }

        set $trimet developer.trimet.org;
        proxy_pass https://$trimet/$1?$trimet_args;
        proxy_set_header Host $trimet;
        proxy_set_header Accept-Encoding gzip;
        proxy_cache trimet;
        # Path and query as the dashboard sent them, without the key.
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 15s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # LAMP performance archive: one Parquet per service day, rewritten during
    # the day and again a day or two later, so an hour is fresh enough.
    location ~ ^/mbta/lamp/([A-Za-z0-9_./-]+\.(parquet|csv))$ {
        set $mbta_lamp performancedata.mbta.com;
        proxy_pass https://$mbta_lamp/lamp/$1;
        proxy_set_header Host $mbta_lamp;
        proxy_cache_valid 200 1h;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
