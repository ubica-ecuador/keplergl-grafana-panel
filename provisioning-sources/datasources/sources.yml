apiVersion: 1

# Data sources for the sources bench (:3002) only. Deliberately a separate tree
# from ../provisioning: the Grafana instances on :3000 and :3001 run the Alpine
# image, where the DuckDB plugin cannot load at all, and provisioning a data
# source whose plugin is missing just litters those instances with broken
# entries.

datasources:
  # Reads GeoParquet straight off disk with read_parquet(). `path` blank means
  # an in-memory database — no .duckdb file is needed for that.
  - name: DuckDB
    type: motherduck-duckdb-datasource
    uid: duckdb
    jsonData:
      path: ''
      # The spatial extension is not built in: without it ST_GeomFromWKB and
      # ST_AsGeoJSON are undefined. v0.4.5 runs this per connection; the earlier
      # version this bench was first built against had no datasource-level init
      # SQL at all, which is why the extension used to be loaded per query.
      #
      # `http_client` is a community extension and carries the STAC catalogue
      # search: `http_get` is an ordinary scalar function, so the search URL can
      # be built by concatenation from $__timeFrom()/$__timeTo() — which is what
      # makes the raster follow the dashboard's time range. The `stac` extension
      # would be sugar over the same thing, but it only builds for DuckDB 1.5.5
      # and this data source runs 1.5.4, so this is the route that exists.
      #
      # INSTALL reaches out to DuckDB's extension repository the first time, so
      # the first query after a fresh volume needs outbound internet. LOAD alone
      # is enough afterwards.
      #
      # The external file cache is off. It keeps remote files in memory keyed by
      # URL, and when a file changes while several queries read it — the MBTA
      # feeds behind gtfs-rt-mbta.json are replaced every 15 s — it hands a query
      # a mix of both versions: "Malformed JSON" in about 1 query in 800 under
      # load, none in 4877 with it off. It had also grown to 1.4 GB, bounded only
      # by memory_limit (80 % of the host). Re-reading LAMP through the local
      # proxy measured the same with it on or off. The setting is instance-wide,
      # which is why it lives here and not in one dashboard's queries.
      initSql: 'INSTALL spatial; LOAD spatial; INSTALL http_client FROM community; LOAD http_client; SET enable_external_file_cache = false;'

  # Fetches the GeoJSON and CSV fixtures over HTTP from the `sources-data`
  # container. No authentication: it is a static file server on the compose
  # network, not something reachable from outside.
  - name: Infinity
    type: yesoreyeram-infinity-datasource
    uid: infinity
    jsonData: {}
